# /etc/nginx/sites-available/velatv.zeferius.com
# Ativar com:
#   sudo ln -s /etc/nginx/sites-available/velatv.zeferius.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d velatv.zeferius.com

server {
    listen 80;
    listen [::]:80;
    server_name velatv.zeferius.com;

    # O certbot troca este bloco por HTTPS automaticamente.
    location / {
        proxy_pass http://127.0.0.1:8045;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Vídeo e listas grandes: nada de bufferizar nem cortar por tempo.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 600m;
        client_body_timeout 3600s;
    }
}
